<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Installation Interactive : Mandala Lumineux</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #mandalaCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #webcam {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: scaleX(-1);
            z-index: 10;
            background: #222;
            opacity: 0.8;
        }

        #ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin: 0 0 5px 0;
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00f0ff;
        }

        #loading {
            position: absolute;
            font-size: 1.5rem;
            z-index: 20;
            background: #050505;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
</head>
<body>

    <div id="loading">
        <div>Chargement du modèle de détection...</div>
        <small style="color: #888; font-size: 0.8rem;">Patientez quelques secondes</small>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="mandalaCanvas"></canvas>

    <div id="ui-overlay">
        <h1>Mandala Éphémère</h1>
        <p style="margin:0; color:#aaa; font-size:0.9rem;">Bougez vos index face caméra</p>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('mandalaCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const loadingElement = document.getElementById('loading');

        const SIGHT_SEGMENTS = 12; 
        let hueBase = 0;
        let model = null;

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            canvasCtx.fillStyle = '#050505';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawMandalaPoint(x, y, color, size) {
            const centerX = canvasElement.width / 2;
            const centerY = canvasElement.height / 2;
            const relX = x - centerX;
            const relY = y - centerY;
            const radius = Math.sqrt(relX * relX + relY * relY);
            const initialAngle = Math.atan2(relY, relX);

            canvasCtx.save();
            canvasCtx.translate(centerX, centerY);

            for (let i = 0; i < SIGHT_SEGMENTS; i++) {
                const angle = initialAngle + (i * (Math.PI * 2) / SIGHT_SEGMENTS);
                const drawX = Math.cos(angle) * radius;
                const drawY = Math.sin(angle) * radius;

                canvasCtx.fillStyle = color;
                canvasCtx.shadowBlur = 12;
                canvasCtx.shadowColor = color;

                canvasCtx.beginPath();
                canvasCtx.arc(drawX, drawY, size, 0, Math.PI * 2);
                canvasCtx.fill();
            }
            canvasCtx.restore();
        }

        // Boucle de détection continue
        async function detectHands() {
            // Effet d'atténuation pour la traînée du mandala
            canvasCtx.fillStyle = 'rgba(5, 5, 5, 0.04)';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            hueBase = (hueBase + 0.5) % 360;

            if (videoElement.readyState === Array.prototype.indexOf.call(videoElement, videoElement) + 4) { // Conv. vidéo prête
                const predictions = await model.estimateHands(videoElement);

                if (predictions.length > 0) {
                    if (loadingElement) loadingElement.style.display = 'none';

                    predictions.forEach((prediction, index) => {
                        // L'index 8 correspond au bout de l'index dans Handpose également
                        const indexTip = prediction.landmarks[8]; 

                        // Ajustement des ratios par rapport à la taille de la vidéo (640x480)
                        // Miroir appliqué via (640 - indexTip[0])
                        const x = ((640 - indexTip[0]) / 640) * canvasElement.width;
                        const y = (indexTip[1] / 480) * canvasElement.height;

                        const color = `hsl(${(hueBase + (index * 140)) % 360}, 100%, 60%)`;
                        
                        // Taille du point fixe ou dynamique
                        const size = 6;

                        drawMandalaPoint(x, y, color, size);
                    });
                }
            }
            // Relancer la détection à l'image suivante
            requestAnimationFrame(detectHands);
        }

        // Initialisation globale
        async function init() {
            try {
                // 1. Démarrer la webcam
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });
                videoElement.srcObject = stream;
                
                // Attendre que la vidéo soit chargée
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => resolve();
                });

                // 2. Charger le modèle IA Handpose
                model = await handpose.load();
                
                if(loadingElement) loadingElement.style.display = 'none';
                
                // 3. Lancer la boucle
                detectHands();

            } catch (err) {
                loadingElement.innerHTML = `
                    <div style="color: #ff3333; text-align:center; padding: 20px;">
                        <h3>Erreur d'accès</h3>
                        <p>${err.message}</p>
                        <small>Vérifiez les permissions de votre caméra.</small>
                    </div>
                `;
                console.error(err);
            }
        }

        // Lancement au chargement de la page
        window.onload = init;
    </script>
</body>
</html>
